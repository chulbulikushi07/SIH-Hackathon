<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Anomaly Watch — NSE Market Surveillance Terminal for detecting unusual trading activity using rolling z-score analysis.">

    <title>{% block title %}Anomaly Watch — Market Surveillance{% endblock %}</title>

    <!-- Bootstrap 5.3 (grid & utilities only) -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Fonts — Inter (labels) + JetBrains Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

    <!-- Terminal Noir stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    {% block content %}
    {% endblock %}

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

</body>
</html>
